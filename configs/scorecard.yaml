# Scorecard (P4). Odds de BUEN pagador: (1 - PD) / PD.
base_score: 600   # puntaje con odds_base
base_odds: 50     # 50:1, equivale a PD = 1/51 ~ 1.96 %
pdo: 20           # puntos para duplicar las odds
n_bins: 10        # bandas de puntaje para la tabla de validación
scheme: temporal  # misma partición que los modelos de PD
modelo: mlp       # logreg | mlp (red final de P2, seleccionada para la app)
ruta_modelo: models/pd_temporal_6432_relu_seed42.pt
